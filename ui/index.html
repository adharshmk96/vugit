<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vugit</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/alpine.min.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="app-header">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">vu</span><span class="brand-rest">git</span>
      </div>
      <div class="repo-id" id="repo-id">
        <span class="repo-name" id="repo-name">—</span>
        <span class="branch-pill" id="branch-pill">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M9.5 3.25a2.25 2.25 0 1 1 3 2.122V6A2.5 2.5 0 0 1 10 8.5H6a1 1 0 0 0-1 1v1.128a2.251 2.251 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.5 0v1.836A2.492 2.492 0 0 1 6 7h4a1 1 0 0 0 1-1v-.628A2.25 2.25 0 0 1 9.5 3.25Zm-6 0a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Zm8.25-.75a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM4.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"/></svg>
        <span id="branch-name">—</span>
        </span>
        <span class="sync-pill" id="sync-pill" hidden></span>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="refresh-btn" title="Refresh (r)">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.364-.626A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .4-.2l2.1 1.575a.25.25 0 0 1 0 .4L8.4 4.1a.25.25 0 0 1-.4-.2V3Z"/></svg>
          Refresh
        </button>
      </div>
    </header>

    <nav class="tabs" id="tabs" x-data="tabsNav">
      <template x-for="t in tabs" :key="t.id">
        <button class="tab" :class="{ 'is-active': t.id === active }" @click="select(t.id)" x-text="t.label"></button>
      </template>
    </nav>
    </div>

    <main class="content" id="content"></main>
  </div>

  <div class="toast-stack" x-data x-init="() => {}">
    <template x-for="t in $store.toasts.items" :key="t.id">
      <div class="toast" :class="{ 'toast--error': t.isError }" x-text="t.msg"
           x-transition:enter="toast-enter" x-transition:enter-start="toast-enter-start" x-transition:enter-end="toast-enter-end"
           x-transition:leave="toast-leave" x-transition:leave-start="toast-leave-start" x-transition:leave-end="toast-leave-end"></div>
    </template>
  </div>

  <dialog id="vu-dialog" class="vu-dialog"></dialog>
  <script src="app.js"></script>
  <script src="tabs/branches.js"></script>
  <script src="tabs/commits.js"></script>
  <script src="tabs/changes.js"></script>
  <script src="tabs/tags.js"></script>
  <script src="tabs/remotes.js"></script>
  <script src="tabs/stashes.js"></script>
  <script src="tabs/reflog.js"></script>
  <script src="tabs/submodules.js"></script>
</body>
</html>
